<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Address Tracker</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    

    <div class="tracker text-center container m-0 p-0">
        <p class="text-light fw-bolder fs-4 mt-5">IP Address Tracker</p>
        <div class="IP-locker w-25">
            <input type="search" name="IP-search" id="IP-tracker" class="rounded border-0 p-2 w-100">
            <div class="search-button btn rounded-start-0 mb-1 ms-0">
                <img src="./images/icon-arrow.svg" alt="arrow">
            </div>
        </div> 
        <div class="IP-data bg-body d-flex justify-content-evenly w-75 mt-5 rounded p-4">
            <div class="IP-address border-end text-start w-25">
                <p class="text-secondary">IP address</p>
                <p id="IP-address" class="fw-bolder fs-4 m-0">192.212.174.101</p>
            </div>
            <div class="location border-end text-start w-25">
                <p class="text-secondary">location</p>
                <p id="location" class="fw-bolder fs-4 m-0">Brooklyn, NY 100001</p>
            </div>
            <div class="time-zone border-end text-start w-25">
                <p class="text-secondary">Time Zone</p>
                <p id="Time-Zone" class="fw-bolder fs-4 m-0">UTC-05:00</p>
            </div>
            <div class="isp">
                <p class="text-secondary text-start w-25">ISP</p>
                <p id="isp" class="fw-bolder fs-4 m-0">SpaceX StarLink</p>
            </div>
        </div>
    </div>






    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
